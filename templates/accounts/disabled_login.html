{% load static %}
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="{% static 'css/yovaa.css' %}"><title>YOVAA - Disabled Login</title></head><body><main class="shell">
<h1>YOVAA</h1><h2>Disabled Person Login</h2>{% if error %}<p>{{ error }}</p>{% endif %}
<form method="POST">{% csrf_token %}<label>Phone Number</label><br><input type="tel" name="identifier" required><br><br><label>Password</label><br><input type="password" name="password" required><br><br><button type="submit">Login</button></form>
<p><a href="{% url 'disabled_register' %}">Register</a></p></main></body></html>
