{% load static %}
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="{% static 'css/yovaa.css' %}"><title>YOVAA - General Login</title></head><body><main class="page-shell"><header class="page-header">{% include "partials/yovaa_brand.html" %}<span class="eyebrow">General user access</span></header><section class="card form-card"><div class="flow-intro"><div><span class="eyebrow">Welcome back</span><h1>Sign in to YOVAA</h1><p>Track your pass application and access your digital e-pass.</p></div></div>{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="POST">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><div class="field"><label for="identifier">Phone number</label><input id="identifier" type="tel" name="identifier" autocomplete="username" maxlength="15" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required></div><div class="form-actions"><p class="form-note">New to YOVAA? <a href="{% url 'general_register' %}">Create an account</a></p><button type="submit">Sign in <span aria-hidden="true">→</span></button></div></form></section></main></body></html>
