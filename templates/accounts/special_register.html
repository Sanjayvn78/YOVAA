{% load static %}
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="{% static 'css/yovaa.css' %}"><title>YOVAA - Special Registration</title></head><body><main class="shell">
<h1>YOVAA</h1><h2>Special User Registration</h2>{% if error %}<p>{{ error }}</p>{% endif %}
<form method="POST">{% csrf_token %}
<label>Staff Number</label><br><input name="identifier" required><br><br>
<label>Name</label><br><input name="name" required><br><br>
<label>Phone Number</label><br><input type="tel" name="phone_number" required><br><br>
<label>New Password</label><br><input type="password" name="password" required><br><br>
<label>Confirm Password</label><br><input type="password" name="confirm_password" required><br><br>
<button type="submit">Register</button></form>
<p><a href="{% url 'special_login' %}">Already registered? Login</a></p>
</main></body></html>
