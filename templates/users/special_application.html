<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/css/yovaa.css">
    <title>YOVAA - Special Pass Application</title>
</head>
<body>

    <h1>Special Pass Application</h1>

    <h2>Verified Transport Staff</h2>

    <p>
        <strong>Staff Number:</strong>
        {{ staff.staff_number }}
    </p>

    <p>
        <strong>Name:</strong>
        {{ staff.name }}
    </p>

    <p>
        <strong>Department:</strong>
        {{ staff.department }}
    </p>

    <p>
        <strong>Designation:</strong>
        {{ staff.designation }}
    </p>

    <hr>

    <h2>Travel Details</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Route</label><br>
        <input type="text" name="route" required>

        <br><br>

        <label>Starting Point</label><br>
        <input type="text" name="start_point" required>

        <br><br>

        <label>Destination Point</label><br>
        <input type="text" name="destination_point" required>

        <br><br>

        <button type="submit">
            Submit Application
        </button>
    </form>

</body>
</html>
